<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Fuente moderna -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center bg-light bg-gradient" style="font-family: 'Poppins', sans-serif;">

  <main class="container">
    <div class="card shadow-lg border-0 rounded-4 mx-auto p-4 p-md-5" style="max-width: 400px;">
      <h2 class="text-center text-primary fw-bold mb-4">Crear cuenta</h2>

      <form id="formRegistro">

        <!-- Nombre -->
        <div class="mb-3">
          <label for="usuario" class="form-label">Nombre completo</label>
          <input type="text" id="usuario" class="form-control" placeholder="Tu nombre" required />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required />
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="Ingresá una contraseña" required />
        </div>

        <!-- Confirmar contraseña -->
        <div class="mb-3">
          <label for="confirmar" class="form-label">Confirmar contraseña</label>
          <input type="password" id="confirmar" class="form-control" placeholder="Repetí la contraseña" required />
        </div>

        <!-- Género -->
        <div class="mb-3">
          <label for="genero" class="form-label">Género</label>
          <select id="genero" class="form-select" required>
            <option value="" disabled selected>Seleccioná una opción</option>
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <!-- Edad -->
        <div class="mb-3">
          <label for="edad" class="form-label">Edad</label>
          <input type="number" id="edad" class="form-control" min="10" max="100" required />
        </div>

        <!-- Botón -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary fw-semibold py-2">Registrarse</button>
        </div>

        <!-- Login -->
        <p class="text-center mt-4 mb-0 text-secondary">
          ¿Ya tenés cuenta?
          <a href="../login/index.html" class="text-decoration-none text-primary fw-semibold">Iniciá sesión</a>
        </p>

      </form>
    </div>
  </main>

  <script src="./registro.js"></script>

</body>
</html>
