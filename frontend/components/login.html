<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body
    class="min-vh-100 d-flex flex-column bg-light bg-gradient"
    style="font-family: 'Poppins', sans-serif"
  >
    <!-- HEADER -->
    <header class="py-3 bg-white shadow-sm">
      <nav class="container d-flex align-items-center justify-content-start">
        <div class="d-flex align-items-center gap-2">
          <div
            class="bg-primary text-white fw-bold rounded-3 d-flex align-items-center justify-content-center"
            style="width: 42px; height: 42px"
          >
            DT
          </div>
          <span class="fw-semibold fs-5 text-dark">Dormitest</span>
        </div>
      </nav>
    </header>

    <!-- MAIN -->
    <main
      class="container d-flex flex-grow-1 align-items-center justify-content-center py-5"
    >
      <div
        class="card shadow-lg border-0 rounded-4 p-4 p-md-5 w-100"
        style="max-width: 400px"
      >
        <h2 class="text-center text-primary fw-bold mb-4">Iniciar Sesión</h2>

        <form id="login">
          <div class="mb-3">
            <label for="usuario" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="usuario"
              placeholder="Ingresá tu email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Ingresá tu contraseña"
              required
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary fw-semibold py-2">
              Ingresar
            </button>
          </div>

          <p class="text-center mt-4 mb-0 text-secondary">
            ¿No tenés cuenta?
            <a
              href="dashboard.html"
              class="text-decoration-none text-primary fw-semibold"
            >
              Registrate
            </a>
          </p>
        </form>
      </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../functions/login.js"></script>
  </body>
</html>
