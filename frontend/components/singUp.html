<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sing Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <body class="min-vh-100 d-flex align-items-center justify-content-center bg-light bg-gradient" style="font-family: 'Poppins', sans-serif;">
  
  <main class="container">
    <div class="card shadow-lg border-0 rounded-4 mx-auto p-4 p-md-5" style="max-width: 400px;">
      <h2 class="text-center text-primary fw-bold mb-4">Crear cuenta</h2>

      <form id="formRegistro">
        <div class="mb-3">
          <label for="usuario" class="form-label">Nombre de usuario</label>
          <input
            type="text"
            id="usuario"
            class="form-control"
            placeholder="Tu nombre de usuario"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="ejemplo@correo.com"
            required
          />
        </div>

         <div class="mb-3">
          <label for="edad" class="form-label">Edad</label>
          <input
            type="number"
            id="edad"
            min="0"
            max="100"
            class="form-control"
            placeholder="Ingresá una edad"
            required
          />
        </div>

        <div class="p-2 bg-secondary mt-4 mb-3 d-flex justify-content-between rounded-1">
          <label for="genero" class="form-label text-light">Genero</label>
          <select name="genero" id="genero">
            <option value="mujer">Mujer</option>
            <option value="hombre">Hombre</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Ingresá una contraseña"
            required
          />
        </div>

        <div class="mb-4">
          <label for="confirmar" class="form-label">Confirmar contraseña</label>
          <input
            type="password"
            id="confirmar"
            class="form-control"
            placeholder="Repetí la contraseña"
            required
          />
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary fw-semibold py-2">
            Registrarse
          </button>
        </div>

        <p class="text-center mt-4 mb-0 text-secondary">
          ¿Ya tenés cuenta?
          <a href="login.html" class="text-decoration-none text-primary fw-semibold">Iniciá sesión</a>
        </p>
      </form>
    </div>
  </main>
  <script src="../functions/singUp.js"></script>
  </body>
</html>
